<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">Multilevel Queue Scheduling — Illustrative Gantt Chart</text>
<text x="600" y="78" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">Example only: sample tasks and durations, not measured output from a benchmark</text>
<text x="90" y="156" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">CPU</text>
<line x1="150" y1="220" x2="1090" y2="220" stroke="#64748b" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle">
<text x="150" y="248">0</text><text x="385" y="248">2</text><text x="620" y="248">4</text><text x="972.5" y="248">7</text><text x="1090" y="248">8</text>
</g>
<g stroke="#cbd5e1" stroke-dasharray="4 5">
<line x1="150" y1="180" x2="150" y2="270"/><line x1="385" y1="180" x2="385" y2="270"/><line x1="620" y1="180" x2="620" y2="270"/><line x1="972.5" y1="180" x2="972.5" y2="270"/><line x1="1090" y1="180" x2="1090" y2="270"/>
</g>
<rect x="150" y="180" width="235" height="58" rx="7" fill="#2563eb"/><text x="267.5" y="215" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Q1 · P1 (2 units)</text>
<rect x="385" y="180" width="235" height="58" rx="7" fill="#3b82f6"/><text x="502.5" y="215" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Q1 · P2 (2 units)</text>
<rect x="620" y="180" width="352.5" height="58" rx="7" fill="#0f766e"/><text x="796.25" y="215" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Q2 · P3 (3 units)</text>
<rect x="972.5" y="180" width="117.5" height="58" rx="7" fill="#d97706"/><text x="1031.25" y="215" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Q3 · P4</text>
<rect x="90" y="310" width="1020" height="130" rx="12" fill="#fff" stroke="#e2e8f0"/>
<text x="120" y="345" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">How to read it</text>
<rect x="120" y="365" width="16" height="16" rx="3" fill="#2563eb"/><text x="145" y="379" font-family="Arial,sans-serif" font-size="15" fill="#334155">Queue 1 (highest)</text>
<rect x="355" y="365" width="16" height="16" rx="3" fill="#0f766e"/><text x="380" y="379" font-family="Arial,sans-serif" font-size="15" fill="#334155">Queue 2 (medium)</text>
<rect x="610" y="365" width="16" height="16" rx="3" fill="#d97706"/><text x="635" y="379" font-family="Arial,sans-serif" font-size="15" fill="#334155">Queue 3 (lowest)</text>
<text x="120" y="411" font-family="Arial,sans-serif" font-size="15" fill="#475569">The chart demonstrates queue-order execution. Replace these sample durations with actual run measurements to create a real performance chart.</text>
<text x="600" y="488" font-family="Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Conceptual illustration • Not a claim of real-time preemption or a kernel-level scheduler</text>
</svg>
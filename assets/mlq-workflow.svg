<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<rect width="1200" height="500" fill="#f8fafc"/>
<text x="600" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">Project Workflow and Runtime Measurement</text>
<text x="600" y="78" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">High-level view of the user-space Multilevel Queue project</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="55" y="155" width="210" height="105" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="160" y="194" font-size="20" font-weight="700" fill="#0f172a">Input</text><text x="160" y="223" font-size="15" fill="#475569">Commands / programs</text>
<line x1="265" y1="207" x2="315" y2="207" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="325" y="125" width="245" height="165" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="447.5" y="153" font-size="19" font-weight="700" fill="#0f172a">Queue classification</text>
<rect x="350" y="170" width="195" height="30" rx="6" fill="#2563eb"/><text x="447.5" y="190" font-size="14" font-weight="700" fill="#fff">Queue 1 · High</text>
<rect x="350" y="210" width="195" height="30" rx="6" fill="#0f766e"/><text x="447.5" y="230" font-size="14" font-weight="700" fill="#fff">Queue 2 · Medium</text>
<rect x="350" y="250" width="195" height="30" rx="6" fill="#d97706"/><text x="447.5" y="270" font-size="14" font-weight="700" fill="#fff">Queue 3 · Low</text>
<line x1="570" y1="207" x2="625" y2="207" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="635" y="155" width="210" height="105" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="740" y="194" font-size="20" font-weight="700" fill="#0f172a">Execution</text><text x="740" y="223" font-size="15" fill="#475569">Run selected commands</text>
<line x1="845" y1="207" x2="900" y2="207" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="910" y="155" width="235" height="105" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1027.5" y="194" font-size="20" font-weight="700" fill="#0f172a">Results</text><text x="1027.5" y="223" font-size="15" fill="#475569">Elapsed runtime / status</text>
</g>
<rect x="120" y="340" width="960" height="95" rx="12" fill="#e2e8f0"/>
<text x="600" y="374" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Important implementation note</text>
<text x="600" y="402" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#334155">This user-space program organizes and launches commands; it does not replace the operating system's kernel CPU scheduler.</text>
<text x="600" y="462" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#64748b">Actual timings depend on the command, system load, and execution environment.</text>
</svg>
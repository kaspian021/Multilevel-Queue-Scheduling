name: Build bilingual reports
on:
  push:
    branches:
      - Exercise-1-Algorithm-Introduction
      - Exercise-2-MLQ-EDF-RM-Comparison
      - Exercise-3-EDF-RM-Manual-Scheduling
      - Exercise-4-Dekker-Peterson-Semaphore-Monitor
      - Exercise-6-Paper-And-Seminar
      - Exercise-7-Readers-Writers-Comparison
    paths-ignore:
      - 'docs/*.docx'
      - 'docs/*.pdf'
      - 'docs/**/*.docx'
      - 'docs/**/*.pdf'
      - 'docs/.base/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'rebuild bilingual reports') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-noto-core fonts-noto-extra
          python -m pip install --upgrade pip
          python -m pip install python-docx docxcompose pypdf
      - name: Build and verify
        run: python tools/build_reports.py
      - name: Commit verified Word and PDF reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.docx docs/*.pdf docs/.base/*.docx
          git diff --cached --quiet || (git commit -m "docs: rebuild bilingual reports" && git push)

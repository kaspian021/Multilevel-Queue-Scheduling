<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Readers–Writers policy trade-offs</text><text x="60" y="103" fill="#9fb0c5" font-family="Arial" font-size="18">Readers may share access; a writer needs exclusive access.</text><rect x="55" y="155" width="345" height="390" rx="20" fill="#183b32" stroke="#77d8a9" stroke-width="2"/><text x="227" y="205" text-anchor="middle" fill="#eafff2" font-family="Arial" font-size="25" font-weight="700">Readers preference</text><text x="90" y="265" fill="#d6f3e2" font-family="Arial" font-size="19">✓ many readers can overlap</text><text x="90" y="310" fill="#d6f3e2" font-family="Arial" font-size="19">✓ high read throughput</text><text x="90" y="355" fill="#ffc1a8" font-family="Arial" font-size="19">! writers may starve</text><text x="90" y="450" fill="#a8e3c3" font-family="Arial" font-size="17">New readers may keep joining</text><text x="90" y="480" fill="#a8e3c3" font-family="Arial" font-size="17">while a writer waits.</text><rect x="427" y="155" width="345" height="390" rx="20" fill="#3a2c1d" stroke="#e8b76d" stroke-width="2"/><text x="599" y="205" text-anchor="middle" fill="#fff5e4" font-family="Arial" font-size="25" font-weight="700">Writers preference</text><text x="462" y="265" fill="#f4e6d1" font-family="Arial" font-size="19">✓ arriving writers are favored</text><text x="462" y="310" fill="#f4e6d1" font-family="Arial" font-size="19">✓ limits writer delay in a queue</text><text x="462" y="355" fill="#ffc1a8" font-family="Arial" font-size="19">! readers may be delayed</text><text x="462" y="450" fill="#f1d2a7" font-family="Arial" font-size="17">New readers are held back</text><text x="462" y="480" fill="#f1d2a7" font-family="Arial" font-size="17">when a writer is queued.</text><rect x="799" y="155" width="345" height="390" rx="20" fill="#1b3046" stroke="#75b8e9" stroke-width="2"/><text x="971" y="205" text-anchor="middle" fill="#edf7ff" font-family="Arial" font-size="25" font-weight="700">FIFO / fair admission</text><text x="834" y="265" fill="#d6e8f6" font-family="Arial" font-size="19">✓ requests follow ticket order</text><text x="834" y="310" fill="#d6e8f6" font-family="Arial" font-size="19">✓ clearer waiting guarantee</text><text x="834" y="355" fill="#d6e8f6" font-family="Arial" font-size="19">• may trade peak throughput</text><text x="834" y="450" fill="#b8d8f0" font-family="Arial" font-size="17">Fairness is encoded by a queue</text><text x="834" y="480" fill="#b8d8f0" font-family="Arial" font-size="17">or a ticket-based admission rule.</text><text x="60" y="590" fill="#c7d2e1" font-family="Arial" font-size="17">Conceptual policy map. The experiment results and exact implementation are documented in code/output.</text></svg>
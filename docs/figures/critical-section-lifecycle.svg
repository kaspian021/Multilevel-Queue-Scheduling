<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#76d8bf"/></marker></defs><rect width="1200" height="650" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Critical-section lifecycle</text><text x="60" y="102" fill="#9fb0c5" font-family="Arial" font-size="18">A synchronization protocol coordinates access to a shared resource.</text><rect x="70" y="190" width="205" height="110" rx="18" fill="#17283d" stroke="#7ca9d7" stroke-width="2"/><text x="172" y="235" text-anchor="middle" fill="#eef6ff" font-family="Arial" font-size="23" font-weight="700">Thread A</text><text x="172" y="267" text-anchor="middle" fill="#c4d5e7" font-family="Arial" font-size="16">outside section</text><rect x="70" y="360" width="205" height="110" rx="18" fill="#17283d" stroke="#7ca9d7" stroke-width="2"/><text x="172" y="405" text-anchor="middle" fill="#eef6ff" font-family="Arial" font-size="23" font-weight="700">Thread B</text><text x="172" y="437" text-anchor="middle" fill="#c4d5e7" font-family="Arial" font-size="16">outside section</text><path d="M275 245 H385 M275 415 H385" stroke="#76d8bf" stroke-width="3" marker-end="url(#s)"/><rect x="405" y="265" width="250" height="160" rx="20" fill="#1b3a34" stroke="#76d8a9" stroke-width="2"/><text x="530" y="310" text-anchor="middle" fill="#eafff2" font-family="Arial" font-size="24" font-weight="700">Entry protocol</text><text x="530" y="348" text-anchor="middle" fill="#d0f1df" font-family="Arial" font-size="17">Dekker / Peterson</text><text x="530" y="378" text-anchor="middle" fill="#d0f1df" font-family="Arial" font-size="17">Semaphore / Monitor</text><text x="530" y="405" text-anchor="middle" fill="#9dddb8" font-family="Arial" font-size="15">wait until access is safe</text><path d="M655 345 H760" stroke="#76d8bf" stroke-width="4" marker-end="url(#s)"/><rect x="780" y="265" width="205" height="160" rx="20" fill="#3b2b1b" stroke="#e8b86e" stroke-width="2"/><text x="882" y="315" text-anchor="middle" fill="#fff4df" font-family="Arial" font-size="24" font-weight="700">Critical</text><text x="882" y="348" text-anchor="middle" fill="#fff4df" font-family="Arial" font-size="24" font-weight="700">section</text><text x="882" y="390" text-anchor="middle" fill="#f0d7ae" font-family="Arial" font-size="16">shared state</text><path d="M985 345 H1080 V500 H530 V435" fill="none" stroke="#76d8bf" stroke-width="3" marker-end="url(#s)"/><rect x="395" y="500" width="270" height="90" rx="18" fill="#202f45" stroke="#7ca9d7" stroke-width="2"/><text x="530" y="538" text-anchor="middle" fill="#eef6ff" font-family="Arial" font-size="21" font-weight="700">Exit / release</text><text x="530" y="566" text-anchor="middle" fill="#c4d5e7" font-family="Arial" font-size="16">release ownership / signal</text><text x="70" y="555" fill="#b7c9dd" font-family="Arial" font-size="17">Safety: at most one owner in the critical section</text><text x="70" y="585" fill="#b7c9dd" font-family="Arial" font-size="17">Liveness: progress and bounded waiting need separate checks</text></svg>
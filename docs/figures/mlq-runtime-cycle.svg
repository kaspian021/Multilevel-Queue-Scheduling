<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#60d6c2"/></marker></defs><rect width="1200" height="620" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">One scheduling decision — repeated each tick</text><text x="60" y="103" fill="#9fb0c5" font-family="Arial" font-size="18">A simplified view of the simulator decision cycle</text><rect x="60" y="165" width="225" height="110" rx="18" fill="#17283d" stroke="#60d6c2" stroke-width="2"/><text x="172" y="207" text-anchor="middle" fill="#ecfffb" font-family="Arial" font-size="21" font-weight="700">1  Admit arrivals</text><text x="172" y="240" text-anchor="middle" fill="#b9cbdc" font-family="Arial" font-size="16">validate job and queue</text><rect x="330" y="165" width="225" height="110" rx="18" fill="#17283d" stroke="#60d6c2" stroke-width="2"/><text x="442" y="207" text-anchor="middle" fill="#ecfffb" font-family="Arial" font-size="21" font-weight="700">2  Choose queue</text><text x="442" y="240" text-anchor="middle" fill="#b9cbdc" font-family="Arial" font-size="16">apply inter-queue policy</text><rect x="600" y="165" width="225" height="110" rx="18" fill="#17283d" stroke="#60d6c2" stroke-width="2"/><text x="712" y="207" text-anchor="middle" fill="#ecfffb" font-family="Arial" font-size="21" font-weight="700">3  Choose process</text><text x="712" y="240" text-anchor="middle" fill="#b9cbdc" font-family="Arial" font-size="16">apply queue-local policy</text><rect x="870" y="165" width="265" height="110" rx="18" fill="#17283d" stroke="#60d6c2" stroke-width="2"/><text x="1002" y="207" text-anchor="middle" fill="#ecfffb" font-family="Arial" font-size="21" font-weight="700">4  Execute</text><text x="1002" y="240" text-anchor="middle" fill="#b9cbdc" font-family="Arial" font-size="16">run one tick / quantum</text><path d="M285 220 H320 M555 220 H590 M825 220 H860" stroke="#60d6c2" stroke-width="4" marker-end="url(#b)"/><path d="M1000 275 V345 H735" fill="none" stroke="#60d6c2" stroke-width="4" marker-end="url(#b)"/><rect x="460" y="345" width="275" height="105" rx="18" fill="#26354a" stroke="#7da7d8" stroke-width="2"/><text x="597" y="384" text-anchor="middle" fill="#f5f9ff" font-family="Arial" font-size="22" font-weight="700">5  Update metrics</text><text x="597" y="416" text-anchor="middle" fill="#cbd9e8" font-family="Arial" font-size="16">wait • response • turnaround</text><rect x="770" y="345" width="300" height="105" rx="18" fill="#3a2b1c" stroke="#e5b45f" stroke-width="2"/><text x="920" y="384" text-anchor="middle" fill="#fff3d9" font-family="Arial" font-size="22" font-weight="700">6  Requeue or finish</text><text x="920" y="416" text-anchor="middle" fill="#edd8b7" font-family="Arial" font-size="16">preempt • rotate • complete</text><path d="M735 398 H760 M770 450 V510 H600 V460" fill="none" stroke="#60d6c2" stroke-width="3" marker-end="url(#b)"/><path d="M460 398 H330 V510 H170 V285" fill="none" stroke="#60d6c2" stroke-width="3" marker-end="url(#b)"/><text x="60" y="565" fill="#cbd5e1" font-family="Arial" font-size="17">The cycle repeats until all jobs complete; exact choices depend on scenario and policy settings.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#77d8bf"/></marker></defs><rect width="1200" height="640" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">A defensible schedulability workflow</text><rect x="60" y="135" width="1080" height="90" rx="18" fill="#17283d" stroke="#77d8bf" stroke-width="2"/><text x="600" y="174" text-anchor="middle" fill="#f0fffa" font-family="Arial" font-size="24" font-weight="700">Define the task model</text><text x="600" y="204" text-anchor="middle" fill="#c2d7d1" font-family="Arial" font-size="17">C, T, D, release/phase assumptions, preemption, processor count, independent tasks</text><path d="M600 225 V270" stroke="#77d8bf" stroke-width="4" marker-end="url(#arr)"/><rect x="60" y="285" width="500" height="185" rx="18" fill="#18364b" stroke="#75bfe8" stroke-width="2"/><text x="310" y="330" text-anchor="middle" fill="#e9f7ff" font-family="Arial" font-size="25" font-weight="700">RM analysis</text><text x="100" y="375" fill="#d5e8f5" font-family="Arial" font-size="19">1. Liu–Layland: sufficient bound</text><text x="100" y="412" fill="#d5e8f5" font-family="Arial" font-size="19">2. Response-time analysis: tighter test</text><text x="100" y="445" fill="#a9d8f0" font-family="Arial" font-size="16">State whether a test is sufficient or exact.</text><rect x="640" y="285" width="500" height="185" rx="18" fill="#183b31" stroke="#77d8a9" stroke-width="2"/><text x="890" y="330" text-anchor="middle" fill="#e8fff2" font-family="Arial" font-size="25" font-weight="700">EDF analysis</text><text x="680" y="375" fill="#d9f2e4" font-family="Arial" font-size="19">1. Implicit deadlines: utilization test</text><text x="680" y="412" fill="#d9f2e4" font-family="Arial" font-size="19">2. Constrained deadlines: demand analysis</text><text x="680" y="445" fill="#a9e5c5" font-family="Arial" font-size="16">Check the test's assumptions before use.</text><path d="M310 470 V520 H600 M890 470 V520 H600 V545" fill="none" stroke="#77d8bf" stroke-width="3" marker-end="url(#arr)"/><rect x="330" y="545" width="540" height="65" rx="16" fill="#3a2b1b" stroke="#e8b76d" stroke-width="2"/><text x="600" y="585" text-anchor="middle" fill="#fff4df" font-family="Arial" font-size="20" font-weight="700">Simulate a finite horizon to inspect the timeline — not as a proof by itself</text></svg>
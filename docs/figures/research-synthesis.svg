<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#76d8bf"/></marker></defs><rect width="1200" height="650" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">From four exercises to one research narrative</text><text x="60" y="103" fill="#9fb0c5" font-family="Arial" font-size="18">The paper and seminar synthesize the evidence rather than invent new measurements.</text><rect x="55" y="155" width="235" height="110" rx="18" fill="#17364b" stroke="#75bfe8" stroke-width="2"/><text x="172" y="198" text-anchor="middle" fill="#ecf8ff" font-family="Arial" font-size="22" font-weight="700">Exercise 1</text><text x="172" y="230" text-anchor="middle" fill="#d0e7f5" font-family="Arial" font-size="16">MLQ model &amp; metrics</text><rect x="335" y="155" width="235" height="110" rx="18" fill="#183b32" stroke="#77d8a9" stroke-width="2"/><text x="452" y="198" text-anchor="middle" fill="#eafff2" font-family="Arial" font-size="22" font-weight="700">Exercise 2</text><text x="452" y="230" text-anchor="middle" fill="#d2f1df" font-family="Arial" font-size="16">EDF / RM comparison</text><rect x="615" y="155" width="235" height="110" rx="18" fill="#3b2c1d" stroke="#e8b76d" stroke-width="2"/><text x="732" y="198" text-anchor="middle" fill="#fff5e4" font-family="Arial" font-size="22" font-weight="700">Exercise 3</text><text x="732" y="230" text-anchor="middle" fill="#f3e4cb" font-family="Arial" font-size="16">hand-worked validation</text><rect x="895" y="155" width="250" height="110" rx="18" fill="#352744" stroke="#c39be7" stroke-width="2"/><text x="1020" y="198" text-anchor="middle" fill="#f7efff" font-family="Arial" font-size="22" font-weight="700">Exercise 4</text><text x="1020" y="230" text-anchor="middle" fill="#e7d9f5" font-family="Arial" font-size="16">sync correctness &amp; costs</text><path d="M172 265 V330 H600 M452 265 V330 M732 265 V330 M1020 265 V330 H600 V360" fill="none" stroke="#76d8bf" stroke-width="3" marker-end="url(#r)"/><rect x="365" y="375" width="470" height="105" rx="20" fill="#1b3440" stroke="#76d8bf" stroke-width="2"/><text x="600" y="418" text-anchor="middle" fill="#effff9" font-family="Arial" font-size="25" font-weight="700">Evidence synthesis</text><text x="600" y="450" text-anchor="middle" fill="#c5dfd7" font-family="Arial" font-size="17">simulation • analysis • model checking • hand trace</text><path d="M600 480 V530 H360 V555 M600 530 H840 V555" fill="none" stroke="#76d8bf" stroke-width="3" marker-end="url(#r)"/><rect x="220" y="555" width="280" height="70" rx="16" fill="#17283d" stroke="#75bfe8" stroke-width="2"/><text x="360" y="600" text-anchor="middle" fill="#edf7ff" font-family="Arial" font-size="23" font-weight="700">Research paper</text><rect x="700" y="555" width="280" height="70" rx="16" fill="#17283d" stroke="#c39be7" stroke-width="2"/><text x="840" y="600" text-anchor="middle" fill="#f7efff" font-family="Arial" font-size="23" font-weight="700">Seminar decks</text></svg>
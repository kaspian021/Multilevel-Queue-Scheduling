<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#61d9c5"/></marker></defs><rect width="1200" height="720" rx="28" fill="#0b1220"/><text x="60" y="68" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Multilevel Queue Scheduling — architecture</text><text x="60" y="108" fill="#9fb0c5" font-family="Arial,sans-serif" font-size="18">Separate ready queues, an inter-queue policy, and a CPU dispatcher</text><rect x="60" y="180" width="220" height="95" rx="16" fill="#17263b" stroke="#54708e" stroke-width="2"/><text x="170" y="218" text-anchor="middle" fill="#eaf2ff" font-size="22" font-family="Arial">System / foreground</text><text x="170" y="249" text-anchor="middle" fill="#9fb0c5" font-size="16" font-family="Arial">high-priority workload</text><rect x="60" y="315" width="220" height="95" rx="16" fill="#17263b" stroke="#54708e" stroke-width="2"/><text x="170" y="353" text-anchor="middle" fill="#eaf2ff" font-size="22" font-family="Arial">Interactive</text><text x="170" y="384" text-anchor="middle" fill="#9fb0c5" font-size="16" font-family="Arial">responsive tasks</text><rect x="60" y="450" width="220" height="95" rx="16" fill="#17263b" stroke="#54708e" stroke-width="2"/><text x="170" y="488" text-anchor="middle" fill="#eaf2ff" font-size="22" font-family="Arial">Batch / background</text><text x="170" y="519" text-anchor="middle" fill="#9fb0c5" font-size="16" font-family="Arial">long-running jobs</text><path d="M280 228 H390 M280 363 H390 M280 498 H390" stroke="#61d9c5" stroke-width="4" marker-end="url(#a)"/><rect x="410" y="170" width="265" height="115" rx="18" fill="#123b43" stroke="#61d9c5" stroke-width="2"/><text x="542" y="207" text-anchor="middle" fill="#d8fff5" font-size="23" font-family="Arial" font-weight="700">Queue 1</text><text x="542" y="240" text-anchor="middle" fill="#c4e9e2" font-size="17" font-family="Arial">RR / configured policy</text><rect x="410" y="305" width="265" height="115" rx="18" fill="#26354a" stroke="#7aa2d6" stroke-width="2"/><text x="542" y="342" text-anchor="middle" fill="#eaf2ff" font-size="23" font-family="Arial" font-weight="700">Queue 2</text><text x="542" y="375" text-anchor="middle" fill="#cfdbeb" font-size="17" font-family="Arial">SJF / SRTF / RR / FCFS</text><rect x="410" y="440" width="265" height="115" rx="18" fill="#3b2d1c" stroke="#e7b45b" stroke-width="2"/><text x="542" y="477" text-anchor="middle" fill="#fff3d8" font-size="23" font-family="Arial" font-weight="700">Queue 3</text><text x="542" y="510" text-anchor="middle" fill="#f0d9b1" font-size="17" font-family="Arial">FCFS / configured policy</text><path d="M675 228 H755 V300 M675 363 H755 M675 498 H755 V425 M755 300 V425" fill="none" stroke="#61d9c5" stroke-width="3"/><rect x="785" y="285" width="210" height="155" rx="18" fill="#18263a" stroke="#61d9c5" stroke-width="2"/><text x="890" y="326" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="Arial" font-weight="700">Inter-queue</text><text x="890" y="358" text-anchor="middle" fill="#d7e4f4" font-size="17" font-family="Arial">Fixed priority</text><text x="890" y="386" text-anchor="middle" fill="#d7e4f4" font-size="17" font-family="Arial">or time slicing</text><text x="890" y="414" text-anchor="middle" fill="#8fdccb" font-size="15" font-family="Arial">selects an eligible queue</text><path d="M995 362 H1050" stroke="#61d9c5" stroke-width="4" marker-end="url(#a)"/><rect x="1060" y="310" width="105" height="105" rx="18" fill="#3b2440" stroke="#d7a0e5" stroke-width="2"/><text x="1112" y="370" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial" font-weight="700">CPU</text><text x="60" y="640" fill="#c7d2e1" font-family="Arial" font-size="18">Illustrative queue categories. Actual mapping and policies are defined by each scenario file.</text><text x="60" y="675" fill="#7f93aa" font-family="Arial" font-size="15">The model separates queue membership, the inter-queue rule, and the policy inside each queue.</text></svg>
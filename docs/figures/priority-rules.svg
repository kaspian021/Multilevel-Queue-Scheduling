<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#0b1220"/><text x="60" y="68" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Three schedulers, three priority rules</text><text x="60" y="105" fill="#9fb0c5" font-family="Arial" font-size="18">Do not compare the policies without stating the workload model and assumptions.</text><rect x="55" y="160" width="340" height="370" rx="22" fill="#152b42" stroke="#69c6ee" stroke-width="2"/><text x="225" y="210" text-anchor="middle" fill="#e5f7ff" font-family="Arial" font-size="30" font-weight="700">MLQ</text><text x="90" y="270" fill="#d6e6f4" font-family="Arial" font-size="21">• Select an eligible queue</text><text x="90" y="315" fill="#d6e6f4" font-family="Arial" font-size="21">• Apply inter-queue rule</text><text x="90" y="360" fill="#d6e6f4" font-family="Arial" font-size="21">• Apply queue-local policy</text><text x="90" y="430" fill="#93d5f1" font-family="Arial" font-size="18">Priority is driven by queue assignment</text><text x="90" y="462" fill="#93d5f1" font-family="Arial" font-size="18">and configured scheduling policies.</text><rect x="430" y="160" width="340" height="370" rx="22" fill="#17382e" stroke="#73d9ad" stroke-width="2"/><text x="600" y="210" text-anchor="middle" fill="#e6fff3" font-family="Arial" font-size="30" font-weight="700">EDF</text><text x="465" y="270" fill="#d7f2e5" font-family="Arial" font-size="21">• Inspect ready jobs</text><text x="465" y="315" fill="#d7f2e5" font-family="Arial" font-size="21">• Compare absolute deadlines</text><text x="465" y="360" fill="#d7f2e5" font-family="Arial" font-size="21">• Run the earliest deadline</text><text x="465" y="430" fill="#9ce7c5" font-family="Arial" font-size="18">Dynamic priority can change</text><text x="465" y="462" fill="#9ce7c5" font-family="Arial" font-size="18">as new jobs are released.</text><rect x="805" y="160" width="340" height="370" rx="22" fill="#3b2c1d" stroke="#e8b76d" stroke-width="2"/><text x="975" y="210" text-anchor="middle" fill="#fff5e4" font-family="Arial" font-size="30" font-weight="700">RM</text><text x="840" y="270" fill="#f4e6d1" font-family="Arial" font-size="21">• Assign priority by period</text><text x="840" y="315" fill="#f4e6d1" font-family="Arial" font-size="21">• Shorter period = higher priority</text><text x="840" y="360" fill="#f4e6d1" font-family="Arial" font-size="21">• Priority is fixed per task</text><text x="840" y="430" fill="#f1cf9c" font-family="Arial" font-size="18">A task's priority does not change</text><text x="840" y="462" fill="#f1cf9c" font-family="Arial" font-size="18">when another job arrives.</text><text x="60" y="590" fill="#c7d2e1" font-family="Arial" font-size="18">MLQ is a queue-based policy family; EDF and RM are real-time task scheduling algorithms.</text></svg>
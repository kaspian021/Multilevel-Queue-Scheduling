<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#77d8bf"/></marker></defs><rect width="1200" height="600" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">How the ready job is selected</text><rect x="60" y="140" width="250" height="110" rx="18" fill="#17283d" stroke="#77d8bf" stroke-width="2"/><text x="185" y="185" text-anchor="middle" fill="#f3fffb" font-family="Arial" font-size="23" font-weight="700">Ready set</text><text x="185" y="218" text-anchor="middle" fill="#bfd4ce" font-family="Arial" font-size="16">available jobs at time t</text><path d="M310 195 H430" stroke="#77d8bf" stroke-width="4" marker-end="url(#p)"/><rect x="450" y="120" width="300" height="145" rx="18" fill="#173b32" stroke="#77d8a9" stroke-width="2"/><text x="600" y="165" text-anchor="middle" fill="#eafff2" font-family="Arial" font-size="25" font-weight="700">EDF</text><text x="600" y="205" text-anchor="middle" fill="#d6f3e2" font-family="Arial" font-size="19">Choose the smallest</text><text x="600" y="235" text-anchor="middle" fill="#d6f3e2" font-family="Arial" font-size="19">absolute deadline</text><rect x="450" y="320" width="300" height="145" rx="18" fill="#3a2c1c" stroke="#e5b56b" stroke-width="2"/><text x="600" y="365" text-anchor="middle" fill="#fff5e3" font-family="Arial" font-size="25" font-weight="700">RM</text><text x="600" y="405" text-anchor="middle" fill="#f5e8d2" font-family="Arial" font-size="19">Choose the ready task</text><text x="600" y="435" text-anchor="middle" fill="#f5e8d2" font-family="Arial" font-size="19">with the shortest period</text><path d="M430 195 H410 V392 H440 M750 195 H850 M750 392 H850" stroke="#77d8bf" stroke-width="3" fill="none" marker-end="url(#p)"/><rect x="870" y="140" width="270" height="110" rx="18" fill="#18283b" stroke="#78a7d9" stroke-width="2"/><text x="1005" y="185" text-anchor="middle" fill="#eff7ff" font-family="Arial" font-size="22" font-weight="700">Dynamic priority</text><text x="1005" y="218" text-anchor="middle" fill="#c7d8e8" font-family="Arial" font-size="16">can change per job</text><rect x="870" y="335" width="270" height="110" rx="18" fill="#18283b" stroke="#e5b56b" stroke-width="2"/><text x="1005" y="380" text-anchor="middle" fill="#fff6e7" font-family="Arial" font-size="22" font-weight="700">Fixed task priority</text><text x="1005" y="413" text-anchor="middle" fill="#e6d4b7" font-family="Arial" font-size="16">rank is tied to period</text><text x="60" y="535" fill="#c7d2e1" font-family="Arial" font-size="18">In this exercise D=T for all tasks, so the EDF implicit-deadline utilization test applies.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="28" fill="#0b1220"/><text x="60" y="65" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Match each claim to the right evidence</text><text x="60" y="103" fill="#9fb0c5" font-family="Arial" font-size="18">A result is only as broad as its method, workload, and assumptions.</text><rect x="55" y="150" width="1090" height="95" rx="16" fill="#17283d" stroke="#75bfe8" stroke-width="2"/><text x="85" y="190" fill="#ecf8ff" font-family="Arial" font-size="22" font-weight="700">Policy performance</text><text x="420" y="190" fill="#d3e5f3" font-family="Arial" font-size="19">Discrete-event simulation</text><text x="420" y="220" fill="#9fb0c5" font-family="Arial" font-size="16">Scenario-specific metrics; not a kernel benchmark.</text><rect x="55" y="265" width="1090" height="95" rx="16" fill="#183b32" stroke="#77d8a9" stroke-width="2"/><text x="85" y="305" fill="#eafff2" font-family="Arial" font-size="22" font-weight="700">Schedulability</text><text x="420" y="305" fill="#d7f2e4" font-family="Arial" font-size="19">Analytical RM / EDF tests</text><text x="420" y="335" fill="#a4dbba" font-family="Arial" font-size="16">Valid only under the stated task model and test assumptions.</text><rect x="55" y="380" width="1090" height="95" rx="16" fill="#352744" stroke="#c39be7" stroke-width="2"/><text x="85" y="420" fill="#f7efff" font-family="Arial" font-size="22" font-weight="700">Safety / liveness</text><text x="420" y="420" fill="#e8dcf5" font-family="Arial" font-size="19">Exhaustive finite-state model checking</text><text x="420" y="450" fill="#c8b4dd" font-family="Arial" font-size="16">Two participants, sequential consistency, and the encoded transition model.</text><rect x="55" y="495" width="1090" height="95" rx="16" fill="#3b2c1d" stroke="#e8b76d" stroke-width="2"/><text x="85" y="535" fill="#fff5e4" font-family="Arial" font-size="22" font-weight="700">Runtime cost</text><text x="420" y="535" fill="#f4e6d1" font-family="Arial" font-size="19">Repeated thread benchmarks</text><text x="420" y="565" fill="#e6c99e" font-family="Arial" font-size="16">CPython / GIL / shared sandbox; medians and ranges are contextual.</text><text x="60" y="625" fill="#c7d2e1" font-family="Arial" font-size="17">The paper labels simulation, analysis, model checking, and measurements separately.</text></svg>